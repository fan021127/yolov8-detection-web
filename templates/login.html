<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - YOLOv8 目标检测系统</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">🎯</div>
                <h1>YOLOv8 目标检测系统</h1>
                <p class="subtitle">多类别生活物品智能检测平台</p>
            </div>

            <!-- 登录表单 -->
            <div class="form-panel" id="loginPanel">
                <h2>账号登录</h2>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <button class="btn-primary" id="loginBtn">登 录</button>
                <p class="switch-text">还没有账号？<a href="javascript:void(0)" id="toRegister">立即注册</a></p>
            </div>

            <!-- 注册表单 -->
            <div class="form-panel hidden" id="registerPanel">
                <h2>用户注册</h2>
                <div class="form-group">
                    <label>用户名（至少3个字符）</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码（至少6个字符）</label>
                    <input type="password" id="regPassword" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirm" placeholder="请再次输入密码">
                </div>
                <button class="btn-primary" id="registerBtn">注 册</button>
                <p class="switch-text">已有账号？<a href="javascript:void(0)" id="toLogin">返回登录</a></p>
            </div>

            <!-- 消息提示 -->
            <div class="message-box hidden" id="messageBox"></div>
        </div>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
